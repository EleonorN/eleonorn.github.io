  <main class="wine-app">
    <div class="wine-app-inner">

      <div class="wine-art">
        <img class="wine-art-grapes" src="bilder/druvor.webp" alt="Illustration av en vindruvsklase" width="377" height="480">
        <img class="wine-art-sky" src="bilder/sol.webp" alt="" width="480" height="460" hidden>
        <img class="wine-art-wine" src="bilder/vin-rott.webp" alt="" width="253" height="480" hidden>
      </div>
      <p class="eyebrow">VÄDER × VIN</p>

      <h1>Vilket vin blir<br> det i dag?</h1>

      <p class="intro">Låt vädret bestämma.</p>

      <button id="wineButton" type="button">Hitta mitt vin →</button>
      <div class="test-sky" role="group" aria-label="Testa ett annat väder">
        <p class="test-sky-label">Eller testa ett annat väder:</p>
        <button type="button" data-test-sky="sun" aria-pressed="false">☀️ Sol</button>
        <button type="button" data-test-sky="cloud" aria-pressed="false">☁️ Moln</button>
        <button type="button" data-test-sky="rain" aria-pressed="false">🌧️ Regn</button>
        <button type="button" data-test-sky="snow" aria-pressed="false">❄️ Snö</button>
        <button type="button" data-test-sky="fog" aria-pressed="false">🌫️ Dimma</button>
        <button type="button" data-test-sky="storm" aria-pressed="false">⛈️ Åska</button>
        <button type="button" data-test-sky="live" aria-pressed="false">📍 Stockholm nu</button>
      </div>

      <div id="result" class="result" aria-live="polite">
        <p id="weather"></p>
        <p id="wine" class="wine-name"></p>
        <p id="reason"></p>
      </div>

      <a href="../index.html" class="back-link">← Tillbaka till startsidan</a>

    </div>
